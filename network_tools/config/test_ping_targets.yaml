# Test configuration for local development.
# Exercises OK, WARN (real latency), and ERROR (unreachable) paths.
# Launch: ros2 launch network_tools ping_monitor.launch.py \
#           config_file:=<path>/test_ping_targets.yaml
ping_monitor:
  ros__parameters:
    targets:
      - "localhost:127.0.0.1"
      - "google_dns:8.8.8.8"
      - "cloudflare_dns:1.1.1.1"
      - "unreachable:192.0.2.1"
    hardware_id: "ping.test"
    poll_interval: 5.0
    ping_count: 1
    ping_timeout: 2.0
